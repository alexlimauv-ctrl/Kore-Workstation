<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kore Workstation</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler pour JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Identity Services (OAuth2 API) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation
      const [activeTab, setActiveTab] = useState('dashboard');
      const [infoOpen, setInfoOpen] = useState(false);

      // Profil utilisateur
      const [userProfile, setUserProfile] = useState(() => {
        const saved = localStorage.getItem('kore_userProfile');
        return saved ? JSON.parse(saved) : { firstName: '', lastName: '' };
      });

      // Module Kanban (Projets)
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('kore_tasks');
        return saved ? JSON.parse(saved) : [];
      });
      const [newTaskTitle, setNewTaskTitle] = useState('');

      // Module Agenda (Calendrier)
      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('kore_events');
        return saved ? JSON.parse(saved) : [];
      });
      const [newEventTitle, setNewEventTitle] = useState('');
      const [newEventDate, setNewEventDate] = useState('');

      // Module CV Analyzer
      const [cvText, setCvText] = useState('');
      const [jobDesc, setJobDesc] = useState('');
      const [cvAnalysis, setCvAnalysis] = useState(null);

      // Synchro Google API State
      const [googleClientId, setGoogleClientId] = useState(() => {
        return localStorage.getItem('kore_gclientId') || '';
      });
      const [syncStatus, setSyncStatus] = useState('');

      // Sauvegarde automatique dans localStorage
      useEffect(() => {
        localStorage.setItem('kore_userProfile', JSON.stringify(userProfile));
      }, [userProfile]);

      useEffect(() => {
        localStorage.setItem('kore_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('kore_events', JSON.stringify(events));
      }, [events]);

      useEffect(() => {
        localStorage.setItem('kore_gclientId', googleClientId);
      }, [googleClientId]);

      // Re-render icons quand l'onglet change
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, tasks, events, cvAnalysis, infoOpen]);

      // Actions Profil
      const handleProfileChange = (e) => {
        const { name, value } = e.target;
        setUserProfile(prev => ({ ...prev, [name]: value }));
      };

      // Actions Kanban
      const addTask = (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return;
        const newTask = {
          id: Date.now(),
          title: newTaskTitle,
          status: 'todo'
        };
        setTasks([...tasks, newTask]);
        setNewTaskTitle('');
      };

      const moveTask = (id, newStatus) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, status: newStatus } : t));
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      // Actions Agenda
      const addEvent = (e) => {
        e.preventDefault();
        if (!newEventTitle.trim() || !newEventDate) return;
        const newEvent = {
          id: Date.now(),
          title: newEventTitle,
          date: newEventDate
        };
        setEvents([...events, newEvent]);
        setNewEventTitle('');
        setNewEventDate('');
      };

      const deleteEvent = (id) => {
        setEvents(events.filter(e => e.id !== id));
      };

      // Synchronisation Google Calendar API
      const handleGoogleSync = () => {
        if (window.location.protocol === 'file:') {
          setSyncStatus("⚠️ Google OAuth ne fonctionne pas directement sur un fichier local (file://). Publie ton site sur GitHub Pages pour activer la vraie synchronisation !");
          return;
        }

        if (!googleClientId.trim()) {
          setSyncStatus("Veuillez saisir un Client ID Google Cloud valide.");
          return;
        }

        try {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: googleClientId,
            scope: 'https://www.googleapis.com/auth/calendar.readonly',
            callback: async (response) => {
              if (response.error) {
                setSyncStatus("Erreur d'authentification : " + response.error);
                return;
              }
              setSyncStatus("Connexion réussie ! Récupération des événements...");
              try {
                const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                  headers: { Authorization: `Bearer ${response.access_token}` }
                });
                const data = await res.json();
                if (data.items) {
                  const fetchedEvents = data.items.map(item => ({
                    id: item.id,
                    title: item.summary || 'Événement sans titre',
                    date: item.start?.dateTime ? item.start.dateTime.split('T')[0] : (item.start?.date || '')
                  })).filter(e => e.date);

                  setEvents(prev => {
                    const existingIds = new Set(prev.map(p => p.id));
                    const combined = [...prev];
                    fetchedEvents.forEach(fe => {
                      if (!existingIds.has(fe.id)) combined.push(fe);
                    });
                    return combined;
                  });
                  setSyncStatus("✅ Synchronisation réussie avec Google Calendar !");
                }
              } catch (err) {
                setSyncStatus("Erreur lors du téléchargement des événements.");
              }
            },
          });
          client.requestAccessToken();
        } catch (e) {
          setSyncStatus("API Google Identity non chargée ou Client ID invalide.");
        }
      };

      // Module CV Analyzer Logic
      const analyzeCV = () => {
        if (!cvText.trim() || !jobDesc.trim()) return;
        const wordsCV = cvText.toLowerCase().split(/\W+/);
        const wordsJob = jobDesc.toLowerCase().split(/\W+/);
        
        const keyWordsJob = [...new Set(wordsJob.filter(w => w.length > 3))];
        const matched = keyWordsJob.filter(w => wordsCV.includes(w));
        const score = Math.min(100, Math.round((matched.length / Math.max(1, keyWordsJob.length)) * 100) + 20);

        setCvAnalysis({
          score,
          matches: matched.slice(0, 8),
          missing: keyWordsJob.filter(w => !wordsCV.includes(w)).slice(0, 5)
        });
      };

      // Export/Import JSON
      const exportData = () => {
        const data = {
          userProfile,
          tasks,
          events,
          exportedAt: new Date().toISOString()
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `kore_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importData = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.userProfile) setUserProfile(parsed.userProfile);
              if (parsed.tasks) setTasks(parsed.tasks);
              if (parsed.events) setEvents(parsed.events);
              alert("Données importées avec succès !");
            } catch (err) {
              alert("Fichier JSON invalide.");
            }
          };
        }
      };

      return (
        <div className="flex min-h-screen bg-gray-900 text-gray-100">
          
          {/* Bouton Info (i) en haut à droite */}
          <div className="fixed top-4 right-4 z-50">
            <button 
              onClick={() => setInfoOpen(!infoOpen)} 
              className="w-9 h-9 bg-gray-800 hover:bg-gray-700 text-blue-400 border border-gray-700 rounded-full flex items-center justify-center shadow-lg transition-all"
              title="Informations système"
            >
              <i data-lucide="info" className="w-5 h-5"></i>
            </button>

            {/* Popover / Bulle d'information */}
            {infoOpen && (
              <div className="absolute right-0 mt-2 w-80 bg-gray-800 border border-gray-700 rounded-xl p-4 shadow-2xl text-sm">
                <div className="flex items-center gap-2 mb-2 text-blue-400 font-bold">
                  <i data-lucide="shield-check" className="w-5 h-5"></i>
                  <span>100 % Local & Confidentiel</span>
                </div>
                <p className="text-gray-300 text-xs leading-relaxed mb-3">
                  Toutes vos données (projets, événements, CV, informations personnelles) restent stockées exclusivement dans votre navigateur via <code className="bg-gray-900 px-1 py-0.5 rounded text-blue-300">localStorage</code>.
                </p>
                <p className="text-gray-400 text-xs">
                  Aucun serveur distant, aucun traçage. Vos données vous appartiennent à 100 %.
                </p>
              </div>
            )}
          </div>

          {/* Sidebar */}
          <aside className="w-64 bg-gray-800/60 border-r border-gray-800 p-6 flex flex-col justify-between flex-shrink-0">
            <div>
              <div className="font-extrabold text-xl mb-8 flex items-center gap-2.5 text-white tracking-wide">
                <span className="w-3.5 h-3.5 rounded-full bg-blue-500 shadow-lg shadow-blue-500/50 inline-block"></span>
                KORE WORKSTATION
              </div>

              <nav className="space-y-1.5">
                <button 
                  onClick={() => setActiveTab('dashboard')} 
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${activeTab === 'dashboard' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`}
                >
                  <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Tableau de bord
                </button>
                <button 
                  onClick={() => setActiveTab('kanban')} 
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${activeTab === 'kanban' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`}
                >
                  <i data-lucide="kanban" className="w-4 h-4"></i> Projets (Kanban)
                </button>
                <button 
                  onClick={() => setActiveTab('calendar')} 
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${activeTab === 'calendar' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`}
                >
                  <i data-lucide="calendar" className="w-4 h-4"></i> Agenda
                </button>
                <button 
                  onClick={() => setActiveTab('cv')} 
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${activeTab === 'cv' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`}
                >
                  <i data-lucide="file-text" className="w-4 h-4"></i> Analyse CV
                </button>
              </nav>
            </div>

            {/* Section Bas de Sidebar : Profil & Exporter/Importer */}
            <div className="pt-6 border-t border-gray-800 space-y-4">
              
              {/* Profil Utilisateur */}
              <div className="bg-gray-900/60 p-3 rounded-lg border border-gray-800 space-y-2">
                <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider flex items-center gap-1.5">
                  <i data-lucide="user" className="w-3.5 h-3.5 text-blue-400"></i> Profil Utilisateur
                </div>
                <input 
                  type="text" 
                  name="firstName" 
                  placeholder="Prénom" 
                  value={userProfile.firstName} 
                  onChange={handleProfileChange} 
                  className="w-full bg-gray-800 border border-gray-700 rounded px-2.5 py-1 text-xs text-gray-200 focus:outline-none focus:border-blue-500"
                />
                <input 
                  type="text" 
                  name="lastName" 
                  placeholder="Nom" 
                  value={userProfile.lastName} 
                  onChange={handleProfileChange} 
                  className="w-full bg-gray-800 border border-gray-700 rounded px-2.5 py-1 text-xs text-gray-200 focus:outline-none focus:border-blue-500"
                />
              </div>

              {/* Sauvegarde / Exportation */}
              <div>
                <div className="text-xs font-medium text-gray-400 mb-2">Sauvegarde JSON</div>
                <div className="flex gap-2">
                  <button onClick={exportData} className="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-xs py-1.5 px-2 rounded text-gray-300 flex items-center justify-center gap-1 transition-all">
                    <i data-lucide="download" className="w-3.5 h-3.5"></i> Exporter
                  </button>
                  <label className="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-xs py-1.5 px-2 rounded text-gray-300 flex items-center justify-center gap-1 cursor-pointer transition-all">
                    <i data-lucide="upload" className="w-3.5 h-3.5"></i> Importer
                    <input type="file" accept=".json" onChange={importData} className="hidden" />
                  </label>
                </div>
              </div>

            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 p-8 overflow-y-auto">
            
            {/* Dashboard View */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div>
                  <h1 className="text-2xl font-bold text-white mb-1">
                    Bonjour {userProfile.firstName || userProfile.lastName ? `${userProfile.firstName} ${userProfile.lastName}`.trim() : 'à toi'} 👋
                  </h1>
                  <p className="text-gray-400 text-sm">Bienvenue sur ta Kore Workstation personnelle.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-gray-800/40 border border-gray-800 p-5 rounded-xl">
                    <div className="text-gray-400 text-xs font-semibold mb-1">TÂCHES À FAIRE</div>
                    <div className="text-3xl font-bold text-blue-400">{tasks.filter(t => t.status === 'todo').length}</div>
                  </div>
                  <div className="bg-gray-800/40 border border-gray-800 p-5 rounded-xl">
                    <div className="text-gray-400 text-xs font-semibold mb-1">TÂCHES EN COURS</div>
                    <div className="text-3xl font-bold text-yellow-400">{tasks.filter(t => t.status === 'in-progress').length}</div>
                  </div>
                  <div className="bg-gray-800/40 border border-gray-800 p-5 rounded-xl">
                    <div className="text-gray-400 text-xs font-semibold mb-1">ÉVÉNEMENTS À VENIR</div>
                    <div className="text-3xl font-bold text-emerald-400">{events.length}</div>
                  </div>
                </div>

                <div className="bg-gray-800/30 border border-gray-800 p-6 rounded-xl space-y-3">
                  <h3 className="font-semibold text-gray-200">Aperçu rapide des prochains événements</h3>
                  {events.length === 0 ? (
                    <p className="text-sm text-gray-500 italic">Aucun événement planifié pour le moment.</p>
                  ) : (
                    <ul className="space-y-2">
                      {events.slice(0, 5).map(ev => (
                        <li key={ev.id} className="flex justify-between items-center text-sm bg-gray-800/60 p-2.5 rounded border border-gray-800">
                          <span className="text-gray-200">{ev.title}</span>
                          <span className="text-xs text-blue-400 bg-blue-950 px-2 py-0.5 rounded border border-blue-800/50">{ev.date}</span>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
            )}

            {/* Kanban View */}
            {activeTab === 'kanban' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h1 className="text-2xl font-bold text-white">Gestion de Projets</h1>
                </div>

                <form onSubmit={addTask} className="flex gap-2 max-w-md">
                  <input 
                    type="text" 
                    placeholder="Nouvelle tâche..." 
                    value={newTaskTitle} 
                    onChange={e => setNewTaskTitle(e.target.value)} 
                    className="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3.5 py-2 text-sm text-gray-100 focus:outline-none focus:border-blue-500"
                  />
                  <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg font-medium transition-all">
                    Ajouter
                  </button>
                </form>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* À Faire */}
                  <div className="bg-gray-800/30 border border-gray-800 rounded-xl p-4">
                    <h3 className="font-semibold text-sm text-gray-300 mb-3 flex items-center justify-between">
                      À FAIRE <span className="text-xs bg-gray-800 px-2 py-0.5 rounded text-gray-400">{tasks.filter(t => t.status === 'todo').length}</span>
                    </h3>
                    <div className="space-y-2">
                      {tasks.filter(t => t.status === 'todo').map(task => (
                        <div key={task.id} className="bg-gray-800 p-3 rounded-lg border border-gray-700 flex justify-between items-center text-sm">
                          <span>{task.title}</span>
                          <div className="flex gap-1">
                            <button onClick={() => moveTask(task.id, 'in-progress')} className="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">➔</button>
                            <button onClick={() => deleteTask(task.id)} className="text-xs text-red-400 hover:bg-gray-700 px-1.5 py-1 rounded">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* En cours */}
                  <div className="bg-gray-800/30 border border-gray-800 rounded-xl p-4">
                    <h3 className="font-semibold text-sm text-gray-300 mb-3 flex items-center justify-between">
                      EN COURS <span className="text-xs bg-gray-800 px-2 py-0.5 rounded text-gray-400">{tasks.filter(t => t.status === 'in-progress').length}</span>
                    </h3>
                    <div className="space-y-2">
                      {tasks.filter(t => t.status === 'in-progress').map(task => (
                        <div key={task.id} className="bg-gray-800 p-3 rounded-lg border border-gray-700 flex justify-between items-center text-sm">
                          <span>{task.title}</span>
                          <div className="flex gap-1">
                            <button onClick={() => moveTask(task.id, 'done')} className="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">➔</button>
                            <button onClick={() => deleteTask(task.id)} className="text-xs text-red-400 hover:bg-gray-700 px-1.5 py-1 rounded">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Terminé */}
                  <div className="bg-gray-800/30 border border-gray-800 rounded-xl p-4">
                    <h3 className="font-semibold text-sm text-gray-300 mb-3 flex items-center justify-between">
                      TERMINÉ <span className="text-xs bg-gray-800 px-2 py-0.5 rounded text-gray-400">{tasks.filter(t => t.status === 'done').length}</span>
                    </h3>
                    <div className="space-y-2">
                      {tasks.filter(t => t.status === 'done').map(task => (
                        <div key={task.id} className="bg-gray-800 p-3 rounded-lg border border-gray-700 flex justify-between items-center text-sm opacity-70">
                          <span className="line-through">{task.title}</span>
                          <button onClick={() => deleteTask(task.id)} className="text-xs text-red-400 hover:bg-gray-700 px-1.5 py-1 rounded">✕</button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Calendar View */}
            {activeTab === 'calendar' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h1 className="text-2xl font-bold text-white">Agenda & Événements</h1>
                </div>

                {/* Integration Google Calendar */}
                <div className="bg-gray-800/40 border border-gray-800 p-4 rounded-xl space-y-3">
                  <div className="flex items-center justify-between">
                    <h3 className="text-sm font-semibold text-gray-200 flex items-center gap-2">
                      <i data-lucide="refresh-cw" className="w-4 h-4 text-blue-400"></i> Synchronisation Google Calendar
                    </h3>
                    <button 
                      onClick={handleGoogleSync} 
                      className="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-md font-medium transition-all"
                    >
                      Synchroniser maintenant
                    </button>
                  </div>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="Google OAuth Client ID (ex: xxx.apps.googleusercontent.com)" 
                      value={googleClientId} 
                      onChange={e => setGoogleClientId(e.target.value)} 
                      className="flex-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-blue-500"
                    />
                  </div>
                  {syncStatus && (
                    <div className="text-xs bg-gray-900 p-2.5 rounded border border-gray-700 text-blue-300">
                      {syncStatus}
                    </div>
                  )}
                </div>

                {/* Formulaire ajout manuel */}
                <form onSubmit={addEvent} className="flex gap-2 max-w-lg">
                  <input 
                    type="text" 
                    placeholder="Titre de l'événement..." 
                    value={newEventTitle} 
                    onChange={e => setNewEventTitle(e.target.value)} 
                    className="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3.5 py-2 text-sm text-gray-100 focus:outline-none focus:border-blue-500"
                  />
                  <input 
                    type="date" 
                    value={newEventDate} 
                    onChange={e => setNewEventDate(e.target.value)} 
                    className="bg-gray-800 border border-gray-700 rounded-lg px-3.5 py-2 text-sm text-gray-100 focus:outline-none focus:border-blue-500"
                  />
                  <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg font-medium transition-all">
                    Ajouter
                  </button>
                </form>

                {/* Liste des événements */}
                <div className="bg-gray-800/30 border border-gray-800 rounded-xl p-4">
                  <div className="space-y-2">
                    {events.length === 0 ? (
                      <p className="text-sm text-gray-500 italic p-2">Aucun événement planifié.</p>
                    ) : (
                      events.map(ev => (
                        <div key={ev.id} className="bg-gray-800 p-3 rounded-lg border border-gray-700 flex justify-between items-center text-sm">
                          <div>
                            <div className="font-medium text-gray-200">{ev.title}</div>
                            <div className="text-xs text-gray-400">{ev.date}</div>
                          </div>
                          <button onClick={() => deleteEvent(ev.id)} className="text-xs text-red-400 hover:bg-gray-700 px-2 py-1 rounded">Supprimer</button>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* CV Analyzer View */}
            {activeTab === 'cv' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold text-white">Analyseur de CV</h1>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-400 mb-2">TEXTE DE VOTRE CV</label>
                    <textarea 
                      rows="8" 
                      placeholder="Collez ici le contenu de votre CV..." 
                      value={cvText} 
                      onChange={e => setCvText(e.target.value)} 
                      className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-gray-100 focus:outline-none focus:border-blue-500"
                    ></textarea>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-400 mb-2">DESCRIPTION DU POSTE CIBLÉ</label>
                    <textarea 
                      rows="8" 
                      placeholder="Collez ici l'offre d'emploi..." 
                      value={jobDesc} 
                      onChange={e => setJobDesc(e.target.value)} 
                      className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-gray-100 focus:outline-none focus:border-blue-500"
                    ></textarea>
                  </div>
                </div>

                <button onClick={analyzeCV} className="bg-blue-600 hover:bg-blue-500 text-white text-sm px-6 py-2.5 rounded-lg font-medium transition-all">
                  Lancer l'analyse de correspondance
                </button>

                {cvAnalysis && (
                  <div className="bg-gray-800/40 border border-gray-800 p-6 rounded-xl space-y-4">
                    <div className="flex items-center gap-4">
                      <div className="text-4xl font-extrabold text-blue-400">{cvAnalysis.score}%</div>
                      <div className="text-sm text-gray-300">Score d'adéquation estimé</div>
                    </div>

                    <div>
                      <div className="text-xs font-semibold text-emerald-400 mb-2">MOTS-CLÉS TROUVÉS DANS VOTRE CV</div>
                      <div className="flex flex-wrap gap-2">
                        {cvAnalysis.matches.map((m, i) => (
                          <span key={i} className="bg-emerald-950/60 border border-emerald-800/50 text-emerald-300 text-xs px-2.5 py-1 rounded-md">
                            {m}
                          </span>
                        ))}
                      </div>
                    </div>

                    <div>
                      <div className="text-xs font-semibold text-yellow-400 mb-2">MOTS-CLÉS MANQUANTS CONSEILLÉS</div>
                      <div className="flex flex-wrap gap-2">
                        {cvAnalysis.missing.map((m, i) => (
                          <span key={i} className="bg-yellow-950/60 border border-yellow-800/50 text-yellow-300 text-xs px-2.5 py-1 rounded-md">
                            {m}
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
