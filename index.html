<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kore Workstation</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler pour JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Identity Services (OAuth2 API) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation
      const [activeTab, setActiveTab] = useState('dashboard');
      const [infoOpen, setInfoOpen] = useState(false);
      const [calendarSubView, setCalendarSubView] = useState('calendar');

      // Profil
      const [userProfile, setUserProfile] = useState(() => {
        const saved = localStorage.getItem('kore_userProfile');
        return saved ? JSON.parse(saved) : { firstName: '', lastName: '' };
      });

      // Kanban
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('kore_tasks');
        return saved ? JSON.parse(saved) : [];
      });
      const [newTaskTitle, setNewTaskTitle] = useState('');

      // Notes
      const [notes, setNotes] = useState(() => {
        const saved = localStorage.getItem('kore_notes');
        return saved ? JSON.parse(saved) : [];
      });
      const [newNoteTitle, setNewNoteTitle] = useState('');
      const [newNoteContent, setNewNoteContent] = useState('');

      // Agenda & Événements (Vacances, Multi-jours & Plages d'heures)
      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('kore_events');
        if (!saved) return [];
        try {
          const parsed = JSON.parse(saved);
          const now = new Date();
          return parsed.filter(ev => {
            if (!ev.date) return false;
            const titleLower = (ev.title || '').toLowerCase();
            const isAnniversary = titleLower.includes('anniv') || titleLower.includes('anniversaire') || titleLower.includes('birthday') || ev.category === 'Anniv';
            if (isAnniversary) return true;
            
            const evDate = new Date(ev.endDate || ev.date);
            const diffDays = (now - evDate) / (1000 * 60 * 60 * 24);
            return diffDays <= 7;
          });
        } catch (e) {
          return [];
        }
      });

      const [newEventTitle, setNewEventTitle] = useState('');
      const [newEventDate, setNewEventDate] = useState('');
      const [newEventEndDate, setNewEventEndDate] = useState('');
      const [newEventTime, setNewEventTime] = useState('');
      const [newEventEndTime, setNewEventEndTime] = useState('');
      const [newEventCategory, setNewEventCategory] = useState('RDV');

      // Google OAuth State
      const [googleClientId, setGoogleClientId] = useState(() => {
        return localStorage.getItem('kore_gclientId') || '';
      });
      const [syncStatus, setSyncStatus] = useState('');

      // CV Analyzer State
      const [cvFileName, setCvFileName] = useState('');
      const [cvPdfUrl, setCvPdfUrl] = useState('');
      const [cvTextContent, setCvTextContent] = useState('');
      const [jobDesc, setJobDesc] = useState('');
      const [cvAnalysis, setCvAnalysis] = useState(() => {
        const saved = localStorage.getItem('kore_cvAnalysis');
        return saved ? JSON.parse(saved) : null;
      });

      // Calendrier Visuel Mensuel
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDateStr, setSelectedDateStr] = useState(new Date().toISOString().split('T')[0]);

      // Persistence LocalStorage
      useEffect(() => { localStorage.setItem('kore_userProfile', JSON.stringify(userProfile)); }, [userProfile]);
      useEffect(() => { localStorage.setItem('kore_tasks', JSON.stringify(tasks)); }, [tasks]);
      useEffect(() => { localStorage.setItem('kore_notes', JSON.stringify(notes)); }, [notes]);
      useEffect(() => { localStorage.setItem('kore_events', JSON.stringify(events)); }, [events]);
      useEffect(() => { localStorage.setItem('kore_gclientId', googleClientId); }, [googleClientId]);
      useEffect(() => { localStorage.setItem('kore_cvAnalysis', JSON.stringify(cvAnalysis)); }, [cvAnalysis]);

      // Rendu des icônes Lucide
      useEffect(() => {
        const timer = setTimeout(() => {
          if (window.lucide) window.lucide.createIcons();
        }, 50);
        return () => clearTimeout(timer);
      }, [activeTab, calendarSubView, tasks, events, notes, cvAnalysis, infoOpen, currentDate, selectedDateStr, cvPdfUrl]);

      // Profile Handlers
      const handleProfileChange = (e) => {
        const { name, value } = e.target;
        setUserProfile(prev => ({ ...prev, [name]: value }));
      };

      // Kanban Handlers
      const addTask = (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return;
        setTasks([...tasks, { id: Date.now(), title: newTaskTitle, status: 'todo' }]);
        setNewTaskTitle('');
      };
      const moveTask = (id, newStatus) => setTasks(tasks.map(t => t.id === id ? { ...t, status: newStatus } : t));
      const deleteTask = (id) => setTasks(tasks.filter(t => t.id !== id));

      // Notes Handlers
      const addNote = (e) => {
        if (e) e.preventDefault();
        if (!newNoteTitle.trim() && !newNoteContent.trim()) return;
        setNotes([{ id: Date.now(), title: newNoteTitle || 'Sans titre', content: newNoteContent, date: new Date().toLocaleDateString('fr-FR') }, ...notes]);
        setNewNoteTitle('');
        setNewNoteContent('');
      };
      const deleteNote = (id) => setNotes(notes.filter(n => n.id !== id));

      // Agenda Handlers
      const addEvent = (e) => {
        e.preventDefault();
        if (!newEventTitle.trim() || !newEventDate) return;
        
        const isVacances = newEventCategory === 'Vacances';
        
        setEvents([...events, { 
          id: Date.now(), 
          title: newEventTitle, 
          date: newEventDate, 
          endDate: newEventEndDate || newEventDate, 
          time: isVacances ? '' : newEventTime, 
          endTime: isVacances ? '' : newEventEndTime,
          category: newEventCategory 
        }]);

        setNewEventTitle('');
        setNewEventDate('');
        setNewEventEndDate('');
        setNewEventTime('');
        setNewEventEndTime('');
      };
      const deleteEvent = (id) => setEvents(events.filter(e => e.id !== id));

      // Upload CV sécurisé
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setCvFileName(file.name);
        
        if (cvPdfUrl) { URL.revokeObjectURL(cvPdfUrl); }
        const fileUrl = URL.createObjectURL(file);
        setCvPdfUrl(fileUrl);

        const reader = new FileReader();
        reader.onload = (event) => { setCvTextContent(event.target.result || file.name); };
        reader.readAsText(file);
      };

      // Synchronisation Google Calendar
      const handleGoogleSync = () => {
        if (window.location.protocol === 'file:') {
          setSyncStatus("⚠️ Google OAuth ne fonctionne pas sur fichier local (file://). Publie ton site sur GitHub Pages !");
          return;
        }
        if (!googleClientId.trim()) {
          setSyncStatus("Veuillez saisir un Client ID Google Cloud valide.");
          return;
        }
        try {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: googleClientId,
            scope: 'https://www.googleapis.com/auth/calendar.readonly',
            callback: async (response) => {
              if (response.error) {
                setSyncStatus("Erreur d'authentification : " + response.error);
                return;
              }
              setSyncStatus("Connexion réussie ! Récupération des événements...");
              try {
                const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                  headers: { Authorization: `Bearer ${response.access_token}` }
                });
                const data = await res.json();
                if (data.items) {
                  const fetchedEvents = data.items.map(item => {
                    const startRaw = item.start?.dateTime || item.start?.date || '';
                    const endRaw = item.end?.dateTime || item.end?.date || startRaw;
                    const startDate = startRaw.split('T')[0];
                    let endDate = endRaw.split('T')[0];
                    
                    if (!item.start?.dateTime && startDate !== endDate) {
                      const d = new Date(endDate);
                      d.setDate(d.getDate() - 1);
                      endDate = d.toISOString().split('T')[0];
                    }
                    const time = item.start?.dateTime ? item.start.dateTime.split('T')[1].substring(0, 5) : '';
                    const endTime = item.end?.dateTime ? item.end.dateTime.split('T')[1].substring(0, 5) : '';

                    const title = item.summary || 'Événement sans titre';
                    const titleLower = title.toLowerCase();
                    const isVacation = titleLower.includes('vacance') || titleLower.includes('vacances');

                    return {
                      id: item.id,
                      title: title,
                      date: startDate,
                      endDate: endDate,
                      time: isVacation ? '' : time,
                      endTime: isVacation ? '' : endTime,
                      category: isVacation ? 'Vacances' : 'RDV'
                    };
                  }).filter(e => e.date);

                  setEvents(prev => {
                    const existingIds = new Set(prev.map(p => p.id));
                    const combined = [...prev];
                    const now = new Date();
                    fetchedEvents.forEach(fe => {
                      const evDate = new Date(fe.endDate || fe.date);
                      const diffDays = (now - evDate) / (1000 * 60 * 60 * 24);
                      if (!existingIds.has(fe.id) && diffDays <= 7) {
                        combined.push(fe);
                      }
                    });
                    return combined;
                  });
                  setSyncStatus("✅ Synchronisation réussie avec Google Calendar !");
                }
              } catch (err) {
                setSyncStatus("Erreur lors du téléchargement des événements.");
              }
            }
          });
          client.requestAccessToken();
        } catch (e) {
          setSyncStatus("API Google Identity non chargée ou Client ID invalide.");
        }
      };

      // Helper pour vérifier si une date est couverte par un événement
      const isEventOnDate = (ev, targetDateStr) => {
        const start = ev.date;
        const end = ev.endDate || ev.date;
        return targetDateStr >= start && targetDateStr <= end;
      };

      // Navigation Calendrier Mensuel
      const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
      const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));

      const generateCalendarDays = () => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const startDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
        const days = [];

        for (let i = 0; i < startDay; i++) { days.push(null); }
        for (let d = 1; d <= totalDays; d++) {
          const formattedMonth = String(month + 1).padStart(2, '0');
          const formattedDay = String(d).padStart(2, '0');
          days.push(`${year}-${formattedMonth}-${formattedDay}`);
        }
        return days;
      };

      // Analyse CV
      const runCVAnalysis = () => {
        const textToAnalyze = (cvTextContent + " " + cvFileName).toLowerCase();
        const wordsJob = jobDesc.toLowerCase().split(/\W+/);
        const keyWordsJob = [...new Set(wordsJob.filter(w => w.length > 3))];

        let matched = keyWordsJob.length > 0 ? keyWordsJob.filter(w => textToAnalyze.includes(w)) : ["expériences", "compétences", "formation", "projet"];
        let missing = keyWordsJob.length > 0 ? keyWordsJob.filter(w => !textToAnalyze.includes(w)).slice(0, 5) : ["mots-clés de l'offre non renseignés"];

        const score = Math.min(100, Math.max(35, Math.round((matched.length / Math.max(1, keyWordsJob.length)) * 100) + 15));
        setCvAnalysis({ score, matches: matched.slice(0, 8), missing, fileName: cvFileName || "CV téléchargé", date: new Date().toLocaleDateString('fr-FR') });
      };

      const saveAnalysisToNotes = () => {
        if (!cvAnalysis) return;
        const title = `Analyse CV (${cvAnalysis.score}%) - ${cvAnalysis.fileName}`;
        const content = `Score d'adéquation: ${cvAnalysis.score}%\n\nMots-clés trouvés:\n- ${cvAnalysis.matches.join(', ')}\n\nMots-clés manquants:\n- ${cvAnalysis.missing.join(', ')}`;
        setNotes([{ id: Date.now(), title, content, date: new Date().toLocaleDateString('fr-FR') }, ...notes]);
        alert("Résultat de l'analyse sauvegardé dans les Notes !");
      };

      // Export/Import JSON
      const exportData = () => {
        const data = { userProfile, tasks, notes, events, cvAnalysis, exportedAt: new Date().toISOString() };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const anchor = document.createElement('a');
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", `kore_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      };

      const importData = (e) => {
        const reader = new FileReader();
        if (e.target.files[0]) {
          reader.readAsText(e.target.files[0], "UTF-8");
          reader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.userProfile) setUserProfile(parsed.userProfile);
              if (parsed.tasks) setTasks(parsed.tasks);
              if (parsed.notes) setNotes(parsed.notes);
              if (parsed.events) setEvents(parsed.events);
              if (parsed.cvAnalysis) setCvAnalysis(parsed.cvAnalysis);
              alert("Données importées avec succès !");
            } catch (err) { alert("Fichier JSON invalide."); }
          };
        }
      };

      const getCategoryBadge = (cat) => {
        switch (cat) {
          case 'Devoir': return 'bg-purple-950 text-purple-300 border-purple-800';
          case 'Sport': return 'bg-green-950 text-green-300 border-green-800';
          case 'Anniv': return 'bg-pink-950 text-pink-300 border-pink-800';
          case 'RDV': return 'bg-blue-950 text-blue-300 border-blue-800';
          case 'Vacances': return 'bg-amber-950 text-amber-300 border-amber-800';
          default: return 'bg-gray-800 text-gray-300 border-gray-700';
        }
      };

      return (
        <div className="flex min-h-screen bg-gray-900 text-gray-100">
          
          {/* Info System */}
          <div className="fixed top-4 right-4 z-50">
            <button onClick={() => setInfoOpen(!infoOpen)} className="w-9 h-9 bg-gray-800 hover:bg-gray-700 text-blue-400 border border-gray-700 rounded-full flex items-center justify-center shadow-lg transition-all" title="Informations">
              <i data-lucide="info" className="w-5 h-5"></i>
            </button>
            {infoOpen && (
              <div className="absolute right-0 mt-2 w-80 bg-gray-800 border border-gray-700 rounded-xl p-4 shadow-2xl text-sm">
                <div className="flex items-center gap-2 mb-2 text-blue-400 font-bold">
                  <i data-lucide="shield-check" className="w-5 h-5"></i>
                  <span>100 % Local & Confidentiel</span>
                </div>
                <p className="text-gray-300 text-xs">Données sauvegardées en toute sécurité dans votre navigateur via <code className="bg-gray-900 px-1 py-0.5 rounded text-blue-300">localStorage</code>.</p>
              </div>
            )}
          </div>

          {/* Sidebar */}
          <aside className="w-64 bg-gray-800/60 border-r border-gray-800 p-6 flex flex-col justify-between flex-shrink-0">
            <div>
              <div className="font-extrabold text-xl mb-8 flex items-center gap-2.5 text-white tracking-wide">
                <span className="w-3.5 h-3.5 rounded-full bg-blue-500 shadow-lg shadow-blue-500/50 inline-block"></span>
                KORE WORKSTATION
              </div>

              <nav className="space-y-1.5">
                <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${activeTab === 'dashboard' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`}>
                  <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Tableau de bord
                </button>
                <button onClick={() => setActiveTab('kanban')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${activeTab === 'kanban' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`}>
                  <i data-lucide="kanban" className="w-4 h-4"></i> Projets (Kanban)
                </button>
                <button onClick={() => setActiveTab('calendar')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${activeTab === 'calendar' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`}>
                  <i data-lucide="calendar" className="w-4 h-4"></i> Agenda
                </button>
                <button onClick={() => setActiveTab('notes')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${activeTab === 'notes' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`}>
                  <i data-lucide="sticky-note" className="w-4 h-4"></i> Notes
                </button>
                <button onClick={() => setActiveTab('cv')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all ${activeTab === 'cv' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`}>
                  <i data-lucide="file-text" className="w-4 h-4"></i> Analyse CV
                </button>
              </nav>
            </div>

            {/* Profile & Backup */}
            <div className="pt-6 border-t border-gray-800 space-y-4">
              <div className="bg-gray-900/60 p-3 rounded-lg border border-gray-800 space-y-2">
                <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider flex items-center gap-1.5">
                  <i data-lucide="user" className="w-3.5 h-3.5 text-blue-400"></i> Profil Utilisateur
                </div>
                <input type="text" name="firstName" placeholder="Prénom" value={userProfile.firstName} onChange={handleProfileChange} className="w-full bg-gray-800 border border-gray-700 rounded px-2.5 py-1 text-xs text-gray-200" />
                <input type="text" name="lastName" placeholder="Nom" value={userProfile.lastName} onChange={handleProfileChange} className="w-full bg-gray-800 border border-gray-700 rounded px-2.5 py-1 text-xs text-gray-200" />
              </div>

              <div>
                <div className="text-xs font-medium text-gray-400 mb-2">Sauvegarde JSON</div>
                <div className="flex gap-2">
                  <button onClick={exportData} className="flex-1 bg-gray-800 hover:bg-gray-750 border border-gray-700 text-xs py-1.5 px-2 rounded text-gray-300 flex items-center justify-center gap-1">
                    <i data-lucide="download" className="w-3.5 h-3.5"></i> Exporter
                  </button>
                  <label className="flex-1 bg-gray-800 hover:bg-gray-750 border border-gray-700 text-xs py-1.5 px-2 rounded text-gray-300 flex items-center justify-center gap-1 cursor-pointer">
                    <i data-lucide="upload" className="w-3.5 h-3.5"></i> Importer
                    <input type="file" accept=".json" onChange={importData} className="hidden" />
                  </label>
                </div>
              </div>
            </div>
          </aside>

          {/* Content Main */}
          <main className="flex-1 p-8 overflow-y-auto">
            
            {/* Dashboard View */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div>
                  <h1 className="text-2xl font-bold text-white mb-1">
                    Bonjour {userProfile.firstName || userProfile.lastName ? `${userProfile.firstName} ${userProfile.lastName}`.trim() : 'à toi'} 👋
                  </h1>
                  <p className="text-gray-400 text-sm">Bienvenue sur ta Kore Workstation personnelle.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-gray-800/40 border border-gray-800 p-5 rounded-xl">
                    <div className="text-gray-400 text-xs font-semibold mb-1">TÂCHES À FAIRE</div>
                    <div className="text-3xl font-bold text-blue-400">{tasks.filter(t => t.status === 'todo').length}</div>
                  </div>
                  <div className="bg-gray-800/40 border border-gray-800 p-5 rounded-xl">
                    <div className="text-gray-400 text-xs font-semibold mb-1">TÂCHES EN COURS</div>
                    <div className="text-3xl font-bold text-yellow-400">{tasks.filter(t => t.status === 'in-progress').length}</div>
                  </div>
                  <div className="bg-gray-800/40 border border-gray-800 p-5 rounded-xl">
                    <div className="text-gray-400 text-xs font-semibold mb-1">ÉVÉNEMENTS À VENIR</div>
                    <div className="text-3xl font-bold text-emerald-400">{events.length}</div>
                  </div>
                  <div className="bg-gray-800/40 border border-gray-800 p-5 rounded-xl">
                    <div className="text-gray-400 text-xs font-semibold mb-1">DERNIER SCORE CV</div>
                    <div className="text-3xl font-bold text-purple-400">{cvAnalysis ? `${cvAnalysis.score}%` : 'N/A'}</div>
                  </div>
                </div>

                {cvAnalysis && (
                  <div className="bg-gray-800/30 border border-gray-800 p-5 rounded-xl space-y-2">
                    <div className="text-sm font-semibold text-gray-200 flex items-center gap-2">
                      <i data-lucide="file-check" className="w-4 h-4 text-purple-400"></i>
                      Dernier Résultat d'Analyse CV ({cvAnalysis.date})
                    </div>
                    <p className="text-xs text-gray-400">Score d'adéquation : <span className="font-bold text-purple-300">{cvAnalysis.score}%</span> pour {cvAnalysis.fileName}.</p>
                  </div>
                )}
              </div>
            )}

            {/* Kanban View */}
            {activeTab === 'kanban' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold text-white">Gestion de Projets</h1>
                <form onSubmit={addTask} className="flex gap-2 max-w-md">
                  <input type="text" placeholder="Nouvelle tâche..." value={newTaskTitle} onChange={e => setNewTaskTitle(e.target.value)} className="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3.5 py-2 text-sm text-gray-100" />
                  <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg font-medium">Ajouter</button>
                </form>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="bg-gray-800/30 border border-gray-800 rounded-xl p-4">
                    <h3 className="font-semibold text-sm text-gray-300 mb-3">À FAIRE</h3>
                    <div className="space-y-2">
                      {tasks.filter(t => t.status === 'todo').map(task => (
                        <div key={task.id} className="bg-gray-800 p-3 rounded-lg border border-gray-700 flex justify-between items-center text-sm">
                          <span>{task.title}</span>
                          <div className="flex gap-1">
                            <button onClick={() => moveTask(task.id, 'in-progress')} className="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">➔</button>
                            <button onClick={() => deleteTask(task.id)} className="text-xs text-red-400 hover:bg-gray-700 px-1.5 py-1 rounded">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-gray-800/30 border border-gray-800 rounded-xl p-4">
                    <h3 className="font-semibold text-sm text-gray-300 mb-3">EN COURS</h3>
                    <div className="space-y-2">
                      {tasks.filter(t => t.status === 'in-progress').map(task => (
                        <div key={task.id} className="bg-gray-800 p-3 rounded-lg border border-gray-700 flex justify-between items-center text-sm">
                          <span>{task.title}</span>
                          <div className="flex gap-1">
                            <button onClick={() => moveTask(task.id, 'done')} className="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">➔</button>
                            <button onClick={() => deleteTask(task.id)} className="text-xs text-red-400 hover:bg-gray-700 px-1.5 py-1 rounded">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-gray-800/30 border border-gray-800 rounded-xl p-4">
                    <h3 className="font-semibold text-sm text-gray-300 mb-3">TERMINÉ</h3>
                    <div className="space-y-2">
                      {tasks.filter(t => t.status === 'done').map(task => (
                        <div key={task.id} className="bg-gray-800 p-3 rounded-lg border border-gray-700 flex justify-between items-center text-sm opacity-70">
                          <span className="line-through">{task.title}</span>
                          <button onClick={() => deleteTask(task.id)} className="text-xs text-red-400 hover:bg-gray-700 px-1.5 py-1 rounded">✕</button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Agenda View */}
            {activeTab === 'calendar' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center flex-wrap gap-4">
                  <h1 className="text-2xl font-bold text-white">Agenda & Événements</h1>
                  
                  <div className="flex bg-gray-800 p-1 rounded-lg border border-gray-700 gap-1">
                    <button onClick={() => setCalendarSubView('calendar')} className={`px-3 py-1.5 text-xs font-medium rounded-md transition-all ${calendarSubView === 'calendar' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-gray-200'}`}>
                      📅 Calendrier Mensuel
                    </button>
                    <button onClick={() => setCalendarSubView('list')} className={`px-3 py-1.5 text-xs font-medium rounded-md transition-all ${calendarSubView === 'list' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-gray-200'}`}>
                      📋 Agenda (Liste)
                    </button>
                  </div>
                </div>

                {/* Google Sync */}
                <div className="bg-gray-800/40 border border-gray-800 p-4 rounded-xl space-y-3">
                  <div className="flex items-center justify-between">
                    <h3 className="text-sm font-semibold text-gray-200">Synchronisation Google Calendar</h3>
                    <button onClick={handleGoogleSync} className="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-md">Synchroniser maintenant</button>
                  </div>
                  <input type="text" placeholder="Google OAuth Client ID" value={googleClientId} onChange={e => setGoogleClientId(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-xs text-gray-200" />
                  {syncStatus && <div className="text-xs bg-gray-900 p-2.5 rounded border border-gray-700 text-blue-300">{syncStatus}</div>}
                </div>

                {/* Formulaire création d'événement */}
                <form onSubmit={addEvent} className="bg-gray-800/40 border border-gray-800 p-4 rounded-xl space-y-3">
                  <div className="flex justify-between items-center">
                    <div className="text-xs font-semibold text-gray-300">CRÉER UN ÉVÉNEMENT</div>
                    <select value={newEventCategory} onChange={e => setNewEventCategory(e.target.value)} className="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1 text-xs text-gray-100">
                      <option value="RDV">RDV</option>
                      <option value="Devoir">Devoir</option>
                      <option value="Sport">Sport</option>
                      <option value="Anniv">Anniv</option>
                      <option value="Vacances">🏖️ Vacances</option>
                      <option value="Autre">Autre</option>
                    </select>
                  </div>

                  <div className="space-y-3">
                    <input type="text" placeholder="Titre de l'événement (ex: Vacances d'été, RDV Médical...)" value={newEventTitle} onChange={e => setNewEventTitle(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100" />

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[10px] text-gray-400 mb-1">DATE DE DÉBUT</label>
                        <input type="date" value={newEventDate} onChange={e => setNewEventDate(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-100" />
                      </div>
                      <div>
                        <label className="block text-[10px] text-gray-400 mb-1">
                          DATE DE FIN {newEventCategory === 'Vacances' && '(ex: jusqu\'au jeudi)'}
                        </label>
                        <input type="date" value={newEventEndDate} onChange={e => setNewEventEndDate(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-100" />
                      </div>
                    </div>

                    {newEventCategory !== 'Vacances' ? (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[10px] text-gray-400 mb-1">HEURE DE DÉBUT (EX: 14:00)</label>
                          <input type="time" value={newEventTime} onChange={e => setNewEventTime(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-100" />
                        </div>
                        <div>
                          <label className="block text-[10px] text-gray-400 mb-1">HEURE DE FIN (EX: 15:00)</label>
                          <input type="time" value={newEventEndTime} onChange={e => setNewEventEndTime(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-100" />
                        </div>
                      </div>
                    ) : (
                      <div className="text-xs text-amber-300 bg-amber-950/40 border border-amber-800/50 p-2.5 rounded-lg flex items-center gap-2">
                        <span>🏖️ Mode Vacances : aucune heure spécifique requise (couvre la période entière).</span>
                      </div>
                    )}
                  </div>

                  <div className="flex justify-end pt-2">
                    <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white text-sm px-5 py-2 rounded-lg font-medium transition-all">
                      Ajouter l'événement
                    </button>
                  </div>
                </form>

                {/* VUE CALENDRIER MENSUEL */}
                {calendarSubView === 'calendar' && (
                  <div className="bg-gray-800/30 border border-gray-800 rounded-xl p-6 space-y-4">
                    <div className="flex justify-between items-center">
                      <h2 className="text-lg font-bold text-white capitalize">
                        {currentDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}
                      </h2>
                      <div className="flex gap-2">
                        <button onClick={prevMonth} className="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded text-xs">Mois préc.</button>
                        <button onClick={() => setCurrentDate(new Date())} className="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded text-xs">Aujourd'hui</button>
                        <button onClick={nextMonth} className="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded text-xs">Mois suiv.</button>
                      </div>
                    </div>

                    <div className="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-gray-400 mb-2">
                      <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
                    </div>

                    <div className="grid grid-cols-7 gap-2">
                      {generateCalendarDays().map((dayStr, index) => {
                        if (!dayStr) return <div key={index} className="bg-gray-900/20 rounded-lg h-24"></div>;
                        const dayEvents = events.filter(e => isEventOnDate(e, dayStr));
                        const isSelected = selectedDateStr === dayStr;

                        return (
                          <div 
                            key={index} 
                            onClick={() => setSelectedDateStr(dayStr)}
                            className={`bg-gray-800/80 border rounded-lg p-2 h-24 flex flex-col justify-between cursor-pointer transition-all ${isSelected ? 'border-blue-500 bg-blue-950/20' : 'border-gray-700 hover:border-gray-500'}`}
                          >
                            <div className="flex justify-between items-center text-xs font-bold text-gray-300">
                              <span>{dayStr.split('-')[2]}</span>
                              {dayEvents.length > 0 && <span className="bg-blue-600 text-white px-1.5 py-0.2 rounded-full text-[10px]">{dayEvents.length}</span>}
                            </div>
                            <div className="space-y-1 overflow-y-auto">
                              {dayEvents.map(ev => (
                                <div key={ev.id} className="text-[10px] bg-gray-900 text-gray-200 px-1 py-0.5 rounded truncate flex items-center gap-1" title={ev.title}>
                                  {ev.time && <span className="text-blue-400 font-mono text-[9px]">{ev.time}</span>}
                                  <span className="truncate">{ev.title}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Prévisualisation des événements de la date sélectionnée */}
                    <div className="bg-gray-800/60 border border-gray-700 p-4 rounded-xl mt-4 space-y-2">
                      <h4 className="text-xs font-semibold text-blue-400 uppercase tracking-wider">Événements pour le {selectedDateStr}</h4>
                      {events.filter(e => isEventOnDate(e, selectedDateStr)).length === 0 ? (
                        <p className="text-xs text-gray-500 italic">Aucun événement ce jour-là.</p>
                      ) : (
                        events.filter(e => isEventOnDate(e, selectedDateStr)).map(ev => (
                          <div key={ev.id} className="flex justify-between items-center text-xs bg-gray-900 p-2.5 rounded border border-gray-750">
                            <div className="flex items-center gap-2">
                              {ev.time && (
                                <span className="bg-blue-950 text-blue-300 px-1.5 py-0.5 rounded border border-blue-800 font-mono text-[10px]">
                                  {ev.time} {ev.endTime ? `➔ ${ev.endTime}` : ''}
                                </span>
                              )}
                              <span className="font-medium text-gray-200">{ev.title}</span>
                              {ev.endDate && ev.endDate !== ev.date && (
                                <span className="text-[10px] text-gray-400">(du {ev.date} au {ev.endDate})</span>
                              )}
                            </div>
                            <span className={`px-2 py-0.5 rounded border ${getCategoryBadge(ev.category)}`}>{ev.category || 'RDV'}</span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}

                {/* VUE LISTE */}
                {calendarSubView === 'list' && (
                  <div className="bg-gray-800/30 border border-gray-800 rounded-xl p-4">
                    <h3 className="text-xs font-semibold text-gray-400 mb-3">LISTE DES ÉVÉNEMENTS</h3>
                    <div className="space-y-2">
                      {events.length === 0 ? (
                        <p className="text-sm text-gray-500 italic p-2">Aucun événement planifié.</p>
                      ) : (
                        events.map(ev => (
                          <div key={ev.id} className="bg-gray-800 p-3 rounded-lg border border-gray-700 flex justify-between items-center text-sm">
                            <div className="flex items-center gap-3">
                              <span className={`text-xs px-2 py-0.5 rounded border ${getCategoryBadge(ev.category)}`}>{ev.category || 'RDV'}</span>
                              <div>
                                <div className="font-medium text-gray-200 flex items-center gap-2">
                                  <span>{ev.title}</span>
                                  {ev.time && (
                                    <span className="text-xs text-blue-400 font-mono">
                                      ({ev.time}{ev.endTime ? ` - ${ev.endTime}` : ''})
                                    </span>
                                  )}
                                </div>
                                <div className="text-xs text-gray-400">
                                  📅 {ev.date} {ev.endDate && ev.endDate !== ev.date ? `➔ ${ev.endDate}` : ''}
                                </div>
                              </div>
                            </div>
                            <button onClick={() => deleteEvent(ev.id)} className="text-xs text-red-400 hover:bg-gray-700 px-2 py-1 rounded">Supprimer</button>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Notes View */}
            {activeTab === 'notes' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold text-white">Bloc-Notes</h1>
                <form onSubmit={addNote} className="bg-gray-800/40 border border-gray-800 p-4 rounded-xl space-y-3 max-w-xl">
                  <input type="text" placeholder="Titre de la note..." value={newNoteTitle} onChange={e => setNewNoteTitle(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3.5 py-2 text-sm text-gray-100" />
                  <textarea rows="3" placeholder="Contenu de la note..." value={newNoteContent} onChange={e => setNewNoteContent(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-gray-100"></textarea>
                  <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg font-medium">Créer la note</button>
                </form>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {notes.length === 0 ? (
                    <p className="text-sm text-gray-500 italic">Aucune note enregistrée.</p>
                  ) : (
                    notes.map(note => (
                      <div key={note.id} className="bg-gray-800/60 border border-gray-700 p-4 rounded-xl space-y-2 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-start">
                            <h3 className="font-bold text-gray-100 text-sm">{note.title}</h3>
                            <span className="text-xs text-gray-400">{note.date}</span>
                          </div>
                          <p className="text-xs text-gray-300 mt-2 whitespace-pre-wrap leading-relaxed">{note.content}</p>
                        </div>
                        <div className="pt-2 flex justify-end">
                          <button onClick={() => deleteNote(note.id)} className="text-xs text-red-400 hover:bg-gray-700 px-2 py-1 rounded">Supprimer</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* CV Analyzer View */}
            {activeTab === 'cv' && (
              <div className="space-y-6">
                <h1 className="text-2xl font-bold text-white">Analyseur de CV</h1>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-gray-400 mb-2">TÉLÉVERSER VOTRE CV (PDF OU TEXTE)</label>
                      <input type="file" accept=".pdf,.txt" onChange={handleFileUpload} className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-xs text-gray-200" />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-gray-400 mb-2">DESCRIPTION DU POSTE CIBLÉ (OPTIONNEL)</label>
                      <textarea rows="6" placeholder="Collez l'offre d'emploi ici..." value={jobDesc} onChange={e => setJobDesc(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-gray-100"></textarea>
                    </div>

                    <button onClick={runCVAnalysis} className="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm py-2.5 rounded-lg font-medium transition-all">
                      ✨ Lancer l'analyse du CV
                    </button>
                  </div>

                  {/* Prévisualisation Iframe sécurisée */}
                  <div className="bg-gray-800/40 border border-gray-800 rounded-xl p-4 flex flex-col h-[400px]">
                    <div className="text-xs font-semibold text-gray-400 mb-3 flex items-center justify-between">
                      <span>APERÇU DU DOCUMENT</span>
                      <span className="text-blue-400">{cvFileName || 'Aucun fichier'}</span>
                    </div>
                    {cvPdfUrl ? (
                      <iframe src={cvPdfUrl} className="w-full flex-1 rounded border border-gray-700 bg-white"></iframe>
                    ) : (
                      <div className="flex-1 flex flex-col items-center justify-center text-gray-500 border border-dashed border-gray-800 rounded-lg">
                        <i data-lucide="file-text" className="w-10 h-10 mb-2 opacity-50"></i>
                        <p className="text-xs">Chargez un fichier PDF pour afficher l'aperçu.</p>
                      </div>
                    )}
                  </div>
                </div>

                {cvAnalysis && (
                  <div className="bg-gray-800/40 border border-gray-800 p-6 rounded-xl space-y-4">
                    <div className="flex justify-between items-center flex-wrap gap-4">
                      <div className="flex items-center gap-4">
                        <div className="text-4xl font-extrabold text-blue-400">{cvAnalysis.score}%</div>
                        <div className="text-sm text-gray-300">Score d'adéquation estimé ({cvAnalysis.fileName})</div>
                      </div>
                      <button onClick={saveAnalysisToNotes} className="bg-purple-600 hover:bg-purple-500 text-white text-xs px-3.5 py-2 rounded-lg font-medium flex items-center gap-1.5">
                        <i data-lucide="bookmark" className="w-3.5 h-3.5"></i> Enregistrer dans les Notes
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                      <div>
                        <div className="text-xs font-semibold text-emerald-400 mb-2">MOTS-CLÉS TROUVÉS</div>
                        <div className="flex flex-wrap gap-1.5">
                          {cvAnalysis.matches.map((m, i) => (
                            <span key={i} className="bg-emerald-950/60 border border-emerald-800/50 text-emerald-300 text-xs px-2.5 py-1 rounded-md">{m}</span>
                          ))}
                        </div>
                      </div>
                      <div>
                        <div className="text-xs font-semibold text-yellow-400 mb-2">MOTS-CLÉS MANQUANTS</div>
                        <div className="flex flex-wrap gap-1.5">
                          {cvAnalysis.missing.map((m, i) => (
                            <span key={i} className="bg-yellow-950/60 border border-yellow-800/50 text-yellow-300 text-xs px-2.5 py-1 rounded-md">{m}</span>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
